<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redcoder</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ececec;
    --fg-strong:#f7f7f7;
    --muted:#9a9a9d;
    --placeholder:#6f6f73;
    --surface:#1c1c1e;
    --surface-hi:#262629;
    --surface-2:#2a2a2d;
    --border:rgba(255,255,255,.09);
    --border-hi:rgba(255,255,255,.16);
    --code-bg:#0f0f10;
    --font: "Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
    --mono:"Cascadia Code","Cascadia Mono","Consolas","SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:var(--font);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::selection{background:rgba(255,255,255,.18)}

  /* ---------- top bar ---------- */
  header{
    position:fixed;top:0;left:0;right:0;height:60px;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
  }
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:10px;color:var(--fg);
    transition:background .15s ease;
  }
  .icon-btn:hover{background:var(--surface-hi)}
  .top-right{display:flex;align-items:center;gap:4px}
  .top-link{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 14px;border-radius:11px;font-size:15px;font-weight:600;
    color:var(--fg-strong);transition:background .15s ease;
  }
  .top-link:hover{background:var(--surface-hi)}
  .top-link svg{width:18px;height:18px;opacity:.95}

  /* ---------- layout ---------- */
  main{height:100dvh;display:flex;flex-direction:column;position:relative}
  #thread{
    flex:1;overflow-y:auto;overflow-x:hidden;display:none;
    padding:76px 20px 150px;scroll-behavior:smooth;
  }
  #thread .col{max-width:748px;margin:0 auto}
  body.chat #thread{display:block}

  /* centered landing block */
  #center{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 20px;gap:26px;transition:opacity .28s ease,transform .28s ease;
  }
  body.chat #center{display:none}

  .brand{display:flex;align-items:center;gap:14px;user-select:none;margin-bottom:2px}
  .brand svg{width:44px;height:44px}
  .brand .word{font-size:41px;font-weight:600;letter-spacing:-.5px;color:var(--fg-strong)}

  /* ---------- composer ---------- */
  .composer-wrap{width:100%;max-width:760px}
  .composer{
    background:var(--surface);border:1px solid var(--border);
    border-radius:26px;padding:8px 8px 8px 8px;
    display:flex;flex-direction:column;gap:2px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .composer.focus{border-color:var(--border-hi)}
  .composer .row{display:flex;align-items:flex-end;gap:6px;padding:2px 4px}
  .composer textarea{
    flex:1;background:none;border:none;outline:none;resize:none;
    color:var(--fg);font-family:inherit;font-size:16.5px;line-height:1.5;
    padding:10px 6px;max-height:220px;min-height:26px;
  }
  .composer textarea::placeholder{color:var(--placeholder)}
  .composer .attach{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s;flex:none}
  .composer .attach:hover{background:var(--surface-hi);color:var(--fg)}
  .composer .right{display:flex;align-items:center;gap:8px;flex:none;padding-bottom:2px}

  .model-wrap{position:relative;display:inline-flex;align-items:center}
  .model-pick{
    display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:16px;
    font-size:14.5px;font-weight:600;color:var(--fg-strong);transition:background .15s;
  }
  .model-pick:hover{background:var(--surface-hi)}
  .model-pick .bolt{width:16px;height:16px}
  .model-pick .chev{width:15px;height:15px;opacity:.8}

  .orb{
    width:38px;height:38px;border-radius:50%;flex:none;
    background:#fff;color:#000;display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .15s, color .15s;
  }
  .orb.idle{background:var(--surface-2);color:var(--muted);cursor:default}
  .orb:not(.idle):hover{transform:scale(1.04)}
  .orb:active{transform:scale(.96)}
  .orb svg{width:19px;height:19px}

  /* dropdown */
  .menu{
    position:absolute;bottom:46px;left:0;min-width:220px;background:#111113;
    border:1px solid var(--border-hi);border-radius:14px;padding:6px;z-index:60;
    box-shadow:0 16px 40px rgba(0,0,0,.55);display:none;
  }
  .menu.open{display:block;animation:pop .12s ease}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .menu .item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px;width:100%;text-align:left}
  .menu .item:hover{background:var(--surface-hi)}
  .menu .item .t{font-size:14.5px;font-weight:600;color:var(--fg-strong)}
  .menu .item .d{font-size:12.5px;color:var(--muted);font-weight:400}
  .menu .item.sel .check{margin-left:auto;color:var(--fg)}
  .menu .item .check{margin-left:auto;opacity:0}
  .menu .item.sel .check{opacity:1}
  .menu .item .check{width:16px;height:16px;flex:none}
  .menu .item .txt{display:flex;flex-direction:column;gap:1px}

  /* suggestion pills */
  .suggests{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:760px}
  .pill{
    display:inline-flex;align-items:center;gap:9px;
    padding:10px 16px;border-radius:20px;background:var(--surface);
    border:1px solid var(--border);color:var(--fg-strong);
    font-size:14.5px;font-weight:600;transition:background .15s,border-color .15s;
  }
  .pill:hover{background:var(--surface-hi);border-color:var(--border-hi)}
  .pill svg{width:17px;height:17px;opacity:.9}

  /* ---------- bottom dock (chat mode) ---------- */
  #bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:none;justify-content:center;padding:10px 20px 20px;
    background:linear-gradient(to top,var(--bg) 55%,rgba(0,0,0,0));
  }
  body.chat #bottom{display:flex;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #bottom .composer-wrap{max-width:748px}
  .disclaimer{text-align:center;color:#6b6b6e;font-size:12px;margin-top:9px}

  /* ---------- messages ---------- */
  .msg{margin:0 0 4px;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{display:flex;justify-content:flex-end;margin:22px 0 22px}
  .msg.user .bubble{
    background:var(--surface);border:1px solid var(--border);
    padding:11px 16px;border-radius:20px;max-width:80%;
    font-size:16.5px;white-space:pre-wrap;word-wrap:break-word;color:var(--fg-strong);
  }
  .msg.bot{padding:2px 2px 0}
  .msg.bot .body{font-size:16.5px;color:var(--fg)}
  .msg.bot .body>*:first-child{margin-top:0}
  .msg.bot .body>*:last-child{margin-bottom:0}

  /* markdown */
  .body p{margin:0 0 14px}
  .body h1,.body h2,.body h3,.body h4{margin:22px 0 12px;line-height:1.3;color:var(--fg-strong);font-weight:650}
  .body h1{font-size:24px}.body h2{font-size:21px}.body h3{font-size:18px}.body h4{font-size:16.5px}
  .body ul,.body ol{margin:0 0 14px;padding-left:24px}
  .body li{margin:5px 0}
  .body li::marker{color:var(--muted)}
  .body a{color:#7fb2ff;text-decoration:none}
  .body a:hover{text-decoration:underline}
  .body strong{color:var(--fg-strong);font-weight:680}
  .body em{font-style:italic}
  .body hr{border:none;border-top:1px solid var(--border);margin:20px 0}
  .body blockquote{margin:0 0 14px;padding:2px 0 2px 16px;border-left:3px solid var(--surface-2);color:var(--muted)}
  .body code.inline{background:var(--surface-hi);border:1px solid var(--border);padding:1.5px 6px;border-radius:6px;font-family:var(--mono);font-size:.9em}
  .body table{border-collapse:collapse;margin:0 0 16px;display:block;overflow-x:auto;max-width:100%}
  .body th,.body td{border:1px solid var(--border);padding:8px 13px;text-align:left;font-size:15px}
  .body th{background:var(--surface);color:var(--fg-strong);font-weight:650}

  /* code block */
  .codeblock{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 16px;background:var(--code-bg)}
  .codeblock .cb-head{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#161617;border-bottom:1px solid var(--border)}
  .codeblock .cb-lang{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .codeblock .cb-copy{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:3px 7px;border-radius:7px;transition:background .15s,color .15s}
  .codeblock .cb-copy:hover{background:var(--surface-hi);color:var(--fg)}
  .codeblock .cb-copy svg{width:14px;height:14px}
  .codeblock pre{margin:0;padding:14px 14px;overflow-x:auto}
  .codeblock code{font-family:var(--mono);font-size:13.5px;line-height:1.6;color:#e6e6e6;white-space:pre}

  /* streaming cursor */
  .cursor{display:inline-block;width:9px;height:17px;background:var(--fg);margin-left:2px;vertical-align:-2px;border-radius:1px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* assistant action bar */
  .actions{display:flex;align-items:center;gap:2px;margin:8px 0 26px;opacity:0;transition:opacity .18s}
  .msg.bot:hover .actions,.actions.stay{opacity:1}
  .act{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:var(--muted);transition:background .15s,color .15s}
  .act:hover{background:var(--surface-hi);color:var(--fg)}
  .act svg{width:16px;height:16px}
  .act.ok{color:#69d38a}

  /* scrollbar */
  #thread::-webkit-scrollbar{width:10px}
  #thread::-webkit-scrollbar-thumb{background:#242426;border-radius:8px;border:2px solid #000}
  #thread::-webkit-scrollbar-thumb:hover{background:#333}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c1c1e;border:1px solid var(--border-hi);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .brand .word{font-size:34px}
    .top-link span{display:none}
    #thread{padding-left:14px;padding-right:14px}
  }
</style>
</head>
<body class="landing">

<header>
  <button class="icon-btn" id="expandBtn" title="Focus mode" aria-label="Focus mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M20 8V5a1 1 0 0 0-1-1h-3"/><path d="M4 16v3a1 1 0 0 0 1 1h3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/></svg>
  </button>
  <div class="top-right">
    <button class="top-link" id="historyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg><span>History</span></button>
    <button class="top-link" id="privateBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Private</span></button>
  </div>
</header>

<main>
  <div id="center">
    <div class="brand">
      <div class="word" id="wordmark">Redcoder</div>
    </div>

    <div class="composer-wrap" id="centerDock"><!-- composer injected here --></div>

    <div class="suggests">
      <button class="pill" data-fill="Create a video of "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>Create Videos</button>
      <button class="pill" data-fill="Create an image of "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>Create Images</button>
      <button class="pill" data-fill="Edit this image: "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit Image</button>
      <button class="pill" data-fill="What's the latest news on "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a1 1 0 0 1 1 1v14a2 2 0 0 0 2-2V8"/><rect x="4" y="4" width="14" height="16" rx="1"/><path d="M8 8h6M8 12h6M8 16h4"/></svg>Latest News</button>
    </div>
  </div>

  <div id="thread"><div class="col" id="threadCol"></div></div>

  <div id="bottom"><div class="composer-wrap" id="bottomDock"></div></div>
</main>

<!-- composer template -->
<template id="composerTpl">
  <div class="composer" id="composer">
    <div class="row">
      <button class="attach" title="Attach" id="attachBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l8.49-8.49a3.5 3.5 0 0 1 4.95 4.95l-8.49 8.49a1.5 1.5 0 0 1-2.12-2.12l7.78-7.78"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off" spellcheck="true"></textarea>
      <div class="right">
        <div class="model-wrap">
          <button class="model-pick" id="modelPick">
            <svg class="bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
            <span id="modelLabel">Fast</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="modelMenu">
            <button class="item sel" data-m="Fast"><div class="txt"><span class="t">Fast</span><span class="d">Quick responses</span></div><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button class="item" data-m="Expert"><div class="txt"><span class="t">Expert</span><span class="d">Deeper reasoning</span></div><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button class="item" data-m="Auto"><div class="txt"><span class="t">Auto</span><span class="d">Picks the best mode</span></div><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
          </div>
        </div>
        <button class="orb idle" id="orb" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = s=>document.querySelector(s);
  // ---- app name: change this one line to rename everywhere ----
  const APP_NAME = "Redcoder";
  document.title = APP_NAME;
  const wm = document.getElementById("wordmark"); if(wm) wm.textContent = APP_NAME;
  const tpl = $("#composerTpl").content;
  let currentModel = "Fast";
  let streaming = false;
  const history = [];   // {role, content}

  // ---- markdown renderer (compact, offline) ----
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function inlineMd(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,(m,c)=>`<code class="inline">${c}</code>`);
    s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
    s = s.replace(/(^|\s)_([^_\n]+)_/g,"$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function renderMarkdown(src){
    const blocks=[]; let idx=0;
    // fenced code
    src = src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
      const id="§CB"+(idx++)+"§";
      blocks.push({id,lang:(lang||"").trim(),code:code.replace(/\n$/,"")});
      return "\n"+id+"\n";
    });
    const lines = src.split("\n");
    let html="", i=0;
    function codeFor(tok){
      const b = blocks.find(x=>x.id===tok.trim()); if(!b) return "";
      const lang = b.lang || "text";
      return `<div class="codeblock"><div class="cb-head"><span class="cb-lang">${esc(lang)}</span>`
        +`<button class="cb-copy" data-code="${encodeURIComponent(b.code)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button></div>`
        +`<pre><code>${esc(b.code)}</code></pre></div>`;
    }
    while(i<lines.length){
      let ln = lines[i];
      if(/^§CB\d+§$/.test(ln.trim())){ html+=codeFor(ln); i++; continue; }
      if(/^\s*$/.test(ln)){ i++; continue; }
      let h = ln.match(/^(#{1,4})\s+(.*)$/);
      if(h){ html+=`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`; i++; continue; }
      if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){ html+="<hr>"; i++; continue; }
      if(/^\s*>\s?/.test(ln)){
        let buf=[];
        while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
        html+=`<blockquote>${inlineMd(buf.join(" "))}</blockquote>`; continue;
      }
      // table
      if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        const head = ln.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
        i+=2; const rows=[];
        while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
          rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); i++;
        }
        let t="<table><thead><tr>"+head.map(c=>`<th>${inlineMd(c)}</th>`).join("")+"</tr></thead><tbody>";
        t+=rows.map(r=>"<tr>"+r.map(c=>`<td>${inlineMd(c)}</td>`).join("")+"</tr>").join("");
        html+=t+"</tbody></table>"; continue;
      }
      // unordered list
      if(/^\s*[-*+]\s+/.test(ln)){
        let buf=[];
        while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*[-*+]\s+/,"")); i++; }
        html+="<ul>"+buf.map(x=>`<li>${inlineMd(x)}</li>`).join("")+"</ul>"; continue;
      }
      // ordered list
      if(/^\s*\d+\.\s+/.test(ln)){
        let buf=[];
        while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*\d+\.\s+/,"")); i++; }
        html+="<ol>"+buf.map(x=>`<li>${inlineMd(x)}</li>`).join("")+"</ol>"; continue;
      }
      // paragraph (gather until blank / block)
      let buf=[ln]; i++;
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>|§CB\d+§)/.test(lines[i]) && !/^\s*(---|\*\*\*)\s*$/.test(lines[i])){
        buf.push(lines[i]); i++;
      }
      html+=`<p>${inlineMd(buf.join(" "))}</p>`;
    }
    return html;
  }

  // ---- composer wiring ----
  function mountComposer(into){
    into.innerHTML="";
    into.appendChild(document.importNode(tpl,true));
    wire();
  }
  function wire(){
    const composer=$("#composer"), input=$("#input"), orb=$("#orb");
    input.addEventListener("input",()=>{autoGrow(input);refreshOrb();});
    input.addEventListener("focus",()=>composer.classList.add("focus"));
    input.addEventListener("blur",()=>composer.classList.remove("focus"));
    input.addEventListener("keydown",e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
    });
    orb.addEventListener("click",()=>{ if(input.value.trim()) send(); });
    $("#attachBtn").addEventListener("click",()=>toast("Attachments aren't available offline"));
    const pick=$("#modelPick"), menu=$("#modelMenu");
    pick.addEventListener("click",e=>{ e.stopPropagation(); menu.classList.toggle("open"); });
    menu.querySelectorAll(".item").forEach(it=>it.addEventListener("click",e=>{
      e.stopPropagation();
      currentModel=it.dataset.m; $("#modelLabel").textContent=currentModel;
      menu.querySelectorAll(".item").forEach(x=>x.classList.remove("sel")); it.classList.add("sel");
      menu.classList.remove("open");
    }));
    refreshOrb();
    setTimeout(()=>input.focus(),30);
  }
  function autoGrow(t){t.style.height="auto";t.style.height=Math.min(t.scrollHeight,220)+"px";}
  function refreshOrb(){
    const input=$("#input"), orb=$("#orb");
    const has=input.value.trim().length>0;
    orb.classList.toggle("idle",!has);   // dim when empty, active send button when typing
  }

  document.addEventListener("click",()=>{const m=$("#modelMenu"); if(m)m.classList.remove("open");});

  // suggestion pills
  document.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{
    const input=$("#input"); input.value=p.dataset.fill; autoGrow(input); refreshOrb(); input.focus();
    input.setSelectionRange(input.value.length,input.value.length);
  }));

  // ---- chat flow ----
  const thread=$("#threadCol");
  function goChat(){
    if(document.body.classList.contains("chat")) return;
    document.body.classList.remove("landing");
    document.body.classList.add("chat");
    // Move the ONE composer node into the bottom dock. Its listeners come with
    // it, and there's never a duplicate #input/#orb (the old clone left a hidden
    // second composer that swallowed every message after the first).
    $("#bottomDock").appendChild($("#composer"));
    setTimeout(()=>{const i=$("#input"); if(i) i.focus();},20);
  }
  function addUser(text){
    const el=document.createElement("div"); el.className="msg user";
    const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
    el.appendChild(b); thread.appendChild(el);
  }
  function addBot(){
    const el=document.createElement("div"); el.className="msg bot";
    el.innerHTML='<div class="body"></div>';
    thread.appendChild(el); return el;
  }
  function stick(){ const t=$("#thread"); const near = t.scrollHeight-t.scrollTop-t.clientHeight<120; if(near) t.scrollTop=t.scrollHeight; }
  function scrollEnd(){ const t=$("#thread"); t.scrollTop=t.scrollHeight; }

  async function send(){
    const input=$("#input"); const text=input.value.trim();
    if(!text || streaming) return;
    goChat();
    input.value=""; autoGrow(input); refreshOrb();
    addUser(text); scrollEnd();
    history.push({role:"user",content:text});

    const botEl=addBot(); const body=botEl.querySelector(".body");
    body.innerHTML='';
    streaming=true;

    let raw=""; let pending=false;
    function paint(){ pending=false; try{ body.innerHTML=renderMarkdown(raw); bindCopies(body); }catch(e){ body.textContent=raw; } stick(); }

    try{
      const res=await fetch("/api/chat",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:history,model:currentModel})
      });
      if(!res.ok||!res.body) throw new Error("bad response "+res.status);
      const reader=res.body.getReader(); const dec=new TextDecoder();
      let buf="";
      while(true){
        const {value,done}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true});
        let nl;
        while((nl=buf.indexOf("\n"))>=0){
          const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
          if(!line) continue;
          let obj; try{obj=JSON.parse(line);}catch{continue;}
          if(obj.error){ raw+= (raw?"\n\n":"")+"⚠️ "+obj.error; }
          else if(obj.message && obj.message.content){ raw+=obj.message.content; }
          if(!pending){ pending=true; requestAnimationFrame(paint); }
        }
      }
    }catch(err){
      raw += (raw? "\n\n":"") + "⚠️ Couldn't reach the local model. Is the server running and is Ollama up?\n\n`"+err.message+"`";
    }finally{
      // This ALWAYS runs, so `streaming` can never get stuck true (which would
      // block every later message). Render is wrapped so a bad markdown edge
      // case can't skip the reset.
      try{ body.innerHTML=renderMarkdown(raw); }catch(e){ body.textContent=raw; }
      bindCopies(body);
      if(raw) history.push({role:"assistant",content:raw});
      try{ addActions(botEl, raw); }catch(e){}
      streaming=false; stick();
      const bi=$("#input"); if(bi) bi.focus();
    }
  }

  function bindCopies(scope){
    scope.querySelectorAll(".cb-copy").forEach(b=>{
      if(b._w) return; b._w=true;
      b.addEventListener("click",()=>{
        navigator.clipboard.writeText(decodeURIComponent(b.dataset.code));
        const o=b.innerHTML; b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Copied';
        setTimeout(()=>b.innerHTML=o,1400);
      });
    });
  }
  function addActions(){ /* action bar removed - nothing renders under AI messages */ }
  async function resend(){
    const botEl=addBot(); const body=botEl.querySelector(".body"); body.innerHTML='';
    streaming=true; let raw=""; let pending=false;
    const paint=()=>{pending=false;body.innerHTML=renderMarkdown(raw);bindCopies(body);stick();};
    try{
      const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history,model:currentModel})});
      const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
      while(true){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let nl;
        while((nl=buf.indexOf("\n"))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);if(!line)continue;let o;try{o=JSON.parse(line)}catch{continue}if(o.message&&o.message.content)raw+=o.message.content;if(!pending){pending=true;requestAnimationFrame(paint);}}}
    }catch(e){raw+="⚠️ "+e.message;}
    finally{
      try{ body.innerHTML=renderMarkdown(raw); }catch(_){ body.textContent=raw; }
      bindCopies(body); if(raw) history.push({role:"assistant",content:raw});
      try{ addActions(botEl,raw); }catch(_){}
      streaming=false; stick();
    }
  }

  // top bar buttons
  $("#historyBtn").addEventListener("click",()=>toast(history.length?`${history.filter(m=>m.role==="user").length} message(s) this session`:"No history yet"));
  $("#privateBtn").addEventListener("click",function(){this.classList.toggle("ok");toast("Private chat is always on — nothing leaves this machine");});
  $("#expandBtn").addEventListener("click",()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); });

  let toastT;
  function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}

  // init
  mountComposer($("#centerDock"));

  // hidden demo mode for visual testing only
  if(location.search.includes("demo")){
    goChat();
    addUser("Write a Python function to check if a port is open, and explain it.");
    const b=addBot(); const raw=`Here's a compact TCP port scanner using \`socket\`.\n\n## The function\n\n\`\`\`python\nimport socket\n\ndef is_open(host: str, port: int, timeout: float = 0.5) -> bool:\n    with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:\n        s.settimeout(timeout)\n        return s.connect_ex((host, port)) == 0\n\`\`\`\n\n**How it works**\n\n- \`connect_ex\` returns \`0\` on success instead of raising, so it's clean for scanning.\n- \`settimeout\` keeps a filtered port from hanging the scan.\n- The \`with\` block closes the socket for you.\n\n| Return | Meaning |\n|---|---|\n| \`True\` | Port accepts connections |\n| \`False\` | Closed, filtered, or timed out |\n\nWant a threaded version that sweeps a whole range?`;
    b.querySelector(".body").innerHTML=renderMarkdown(raw); bindCopies(b.querySelector(".body")); addActions(b,raw); scrollEnd();
  }
})();
</script>
</body>
</html>
